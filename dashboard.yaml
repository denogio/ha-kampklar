# Kampklar-dashboard.
#
# Brug: Settings → Dashboards → "Add Dashboard" → "New dashboard from scratch"
# → tre prikker → "Raw configuration editor" → indsæt indholdet herunder.
#
# Dashboardet er navne-uafhængigt: alt hentes fra sensor.kampklar_boern, som
# indeholder ét opslag pr. barn inkl. barnets egne entity-id'er. Får du et
# barn mere tilknyttet din DBU-konto, dukker det op af sig selv — der er
# ingenting at rette her.
#
# Konto-sensorer (dækker alle børn):
#   sensor.kampklar_boern
#   sensor.kampklar_naeste_aktivitet
#   sensor.kampklar_mangler_tilmelding
#   sensor.kampklar_beskeder
#
# Pr. barn (bruges automatisk via opslag i sensor.kampklar_boern):
#   sensor.kampklar_<navn>_naeste_aktivitet
#   sensor.kampklar_<navn>_kommende_aktiviteter
#   sensor.kampklar_<navn>_mangler_tilmelding
#   calendar.kampklar_<navn>_aktiviteter

title: Kampklar
views:
  - title: Kampklar
    icon: mdi:soccer
    cards:
      # ---- Top-række: hurtige tal for hele familien ----
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.kampklar_naeste_aktivitet
            name: Næste aktivitet
            icon: mdi:soccer-field
          - type: entity
            entity: sensor.kampklar_mangler_tilmelding
            name: Mangler svar
            icon: mdi:account-question
          - type: entity
            entity: sensor.kampklar_beskeder
            name: Beskeder
            icon: mdi:email

      # ---- Ét kort pr. barn: næste aktivitet ----
      - type: markdown
        title: Børn
        content: |
          {% set children = state_attr('sensor.kampklar_boern','children') or [] %}
          {% if children | length == 0 %}
          _Ingen børn fundet på DBU-kontoen._
          {% else %}
          {% for c in children %}
          ### {{ c.short_name }}
          _{{ c.team }}{% if c.club %} · {{ c.club }}{% endif %}_

          {% if c.next_activity %}
          ⚽ **{{ c.next_activity.title }}**
          🗓️ {{ c.next_activity.weekday or '' }} {{ c.next_activity.date }}{% if c.next_activity.time %} · kl. {{ c.next_activity.time }}{% endif %}
          {% if c.next_activity.location %}📍 {{ c.next_activity.location }}{% endif %}
          {% if c.next_activity.signup_status %}✅ Status: **{{ c.next_activity.signup_status }}**{% endif %}
          {% else %}
          _Ingen kommende aktiviteter_
          {% endif %}

          {{ c.upcoming_count }} kommende · {{ c.pending_count }} mangler svar

          ---
          {% endfor %}
          {% endif %}

      # ---- Manglende tilmelding på tværs af alle børn ----
      - type: markdown
        title: Mangler tilmelding
        content: |
          {% set acts = state_attr('sensor.kampklar_mangler_tilmelding','activities') or [] %}
          {% if acts | length == 0 %}
          _Alt er besvaret_ ✅
          {% else %}
          {% for a in acts %}
          - **{{ a.child }}** — {{ a.title }} · {{ a.date }} {{ a.time or '' }}
            {%- if a.location %} · {{ a.location }}{% endif %}
          {% endfor %}
          {% endif %}

      # ---- Alle kommende aktiviteter, grupperet pr. barn ----
      # Listerne hentes fra hvert barns egen sensor via de entity-id'er
      # sensor.kampklar_boern oplyser — så virker det uanset antal børn.
      - type: markdown
        title: Kommende aktiviteter
        content: |
          {% for c in state_attr('sensor.kampklar_boern','children') or [] %}
          {% set eid = c.entity_ids.upcoming_activities %}
          {% set acts = (state_attr(eid,'activities') if eid else []) or [] %}
          ### {{ c.short_name }}
          {% if acts | length == 0 %}
          _Ingen kommende aktiviteter_
          {% else %}
          {% for a in acts %}
          **{{ a.title }}** {% if a.type %}· _{{ a.type }}_{% endif %}
          🗓️ {{ a.weekday or '' }} {{ a.date }}{% if a.time %} · kl. {{ a.time }}{% endif %}
          {% if a.location %}📍 {{ a.location }}{% endif %}
          {% if a.signup_status %}✅ **{{ a.signup_status }}**{% if a.signup_locked %} (lukket){% endif %}{% endif %}

          {% endfor %}
          {% endif %}

          ---
          {% endfor %}

      # ---- Kalender ----
      # Kalender-kortet kan desværre ikke tage en dynamisk entity-liste, så her
      # skal hvert barns kalender skrives ind én gang. Find navnene under
      # Settings → Devices & Services → Entities → søg "kampklar" (eller se
      # attributten entity_ids.calendar på sensor.kampklar_boern).
      - type: calendar
        entities:
          - calendar.kampklar_emil_aktiviteter
          # - calendar.kampklar_<næste barn>_aktiviteter
        initial_view: listWeek
        title: Kalender

      # ---- Seneste 10 beskeder med fuld body ----
      # Hver besked er en <details>-blok — klik på subject for at folde ud.
      # "Åbn på dbu.dk" linker til den originale besked.
      - type: markdown
        title: Seneste beskeder
        content: |
          {% set msgs = state_attr('sensor.kampklar_beskeder','messages') or [] %}
          {% if msgs|length == 0 %}
          _Ingen beskeder_
          {% else %}
          {% for m in msgs %}
          <details>
          <summary><b>{{ m.subject }}</b> — <i>{{ m.sender }}</i><br>
          <small>{{ as_timestamp(m.received) | timestamp_custom('%d-%m-%Y %H:%M') }}{% if m.category %} · {{ m.category }}{% endif %} · <a href="{{ m.url }}" target="_blank">Åbn på dbu.dk</a></small></summary>

          {{ m.body | replace('\n','<br>') }}

          </details>

          ---
          {% endfor %}
          {% endif %}
