# Kampklar-automatiseringer.
#
# Placering i HA: <config>/automations/kampklar.yaml
# (forudsætter at du har `automation kampklar: !include_dir_merge_list automations/`
#  eller tilsvarende i configuration.yaml.)
#
# Notify-service: ret notify.mobile_app_min_telefon til din egen mobil-app-service
# (Developer Tools → Actions → søg "notify.mobile_app").
#
# Notifikationer åbner Kampklar-dashboardet ved tryk via `clickAction`.
# Ret stien hvis dit dashboard ligger et andet sted (se URL'en i browseren
# når du står på dashboardet — fx /lovelace/kampklar/0).

# ───────────────────────────────────────────────────────────────
# 1) Ny besked fra DBU → push
#
# Trigger når listen af beskeder ændrer sig OG der er kommet nye IDs til.
# Skipper første kørsel efter HA-genstart (from_state ukendt).
# ───────────────────────────────────────────────────────────────
- id: kampklar_ny_besked
  alias: Kampklar — ny besked
  mode: queued
  trigger:
    - platform: state
      entity_id: sensor.kampklar_beskeder
      attribute: messages
  condition:
    - condition: template
      value_template: >
        {{ trigger.from_state is not none
           and trigger.from_state.state not in ['unknown','unavailable']
           and trigger.from_state.attributes.messages is defined }}
  action:
    - variables:
        old_ids: "{{ trigger.from_state.attributes.messages | map(attribute='id') | list }}"
        new_msgs: >
          {{ trigger.to_state.attributes.messages
             | rejectattr('id','in', old_ids) | list }}
    - condition: template
      value_template: "{{ new_msgs | length > 0 }}"
    - repeat:
        for_each: "{{ new_msgs }}"
        sequence:
          - service: notify.mobile_app_min_telefon
            data:
              title: "DBU: {{ repeat.item.subject }}"
              message: "{{ repeat.item.sender }}: {{ repeat.item.preview }}"
              data:
                tag: "kampklar-msg-{{ repeat.item.id }}"
                channel: Kampklar
                clickAction: "/lovelace/kampklar/0"

# ───────────────────────────────────────────────────────────────
# 2) Ny aktivitet planlagt → push
#
# Lytter på sensor.kampklar_boern, der har ét opslag pr. barn. Dermed dækker
# den ét såvel som fem børn — der er ikke noget at rette når der kommer et
# barn til. Vi sammenligner antal kommende aktiviteter pr. barn og siger til
# når tallet stiger.
# ───────────────────────────────────────────────────────────────
- id: kampklar_ny_aktivitet
  alias: Kampklar — ny aktivitet planlagt
  mode: queued
  trigger:
    - platform: state
      entity_id: sensor.kampklar_boern
      attribute: children
  condition:
    - condition: template
      value_template: >
        {{ trigger.from_state is not none
           and trigger.from_state.state not in ['unknown','unavailable']
           and trigger.from_state.attributes.children is defined }}
  action:
    - variables:
        before: >
          {% set ns = namespace(map={}) %}
          {% for c in trigger.from_state.attributes.children %}
            {% set ns.map = dict(ns.map, **{c.key: c.upcoming_count}) %}
          {% endfor %}
          {{ ns.map }}
        changed: >
          {% set ns = namespace(items=[]) %}
          {% for c in trigger.to_state.attributes.children %}
            {% if c.key not in before or c.upcoming_count > before[c.key] %}
              {% set ns.items = ns.items + [c] %}
            {% endif %}
          {% endfor %}
          {{ ns.items }}
    - condition: template
      value_template: "{{ changed | length > 0 }}"
    - service: notify.mobile_app_min_telefon
      data:
        title: "DBU: nye aktiviteter"
        message: >-
          {% for c in changed %}
          • {{ c.short_name }}: {{ c.upcoming_count }} kommende{% if c.next_activity %} — næste {{ c.next_activity.date }}{% if c.next_activity.time %} kl. {{ c.next_activity.time }}{% endif %}{% endif %}
          {% endfor %}
        data:
          tag: kampklar-new-activity
          channel: Kampklar
          clickAction: "/lovelace/kampklar/0"

# ───────────────────────────────────────────────────────────────
# 3) Påmindelse 2 timer før aktivitet
#
# Kalender-triggeren tager én entitet ad gangen, så her skal hvert barns
# kalender listes som sin egen trigger. Navnene står i attributten
# entity_ids.calendar på sensor.kampklar_boern.
# ───────────────────────────────────────────────────────────────
- id: kampklar_paamindelse_2t
  alias: Kampklar — 2 timer før aktivitet
  mode: parallel
  trigger:
    - platform: calendar
      event: start
      entity_id: calendar.kampklar_emil_aktiviteter
      offset: "-2:00:00"
    # - platform: calendar
    #   event: start
    #   entity_id: calendar.kampklar_<næste barn>_aktiviteter
    #   offset: "-2:00:00"
  action:
    - service: notify.mobile_app_min_telefon
      data:
        title: "Om 2 timer: {{ trigger.calendar_event.summary }}"
        message: >-
          kl. {{ trigger.calendar_event.start.strftime('%H:%M') }}
          {%- if trigger.calendar_event.location %} · {{ trigger.calendar_event.location }}{% endif %}
          {%- if trigger.calendar_event.description %}

          {{ trigger.calendar_event.description }}{% endif %}
        data:
          tag: "kampklar-reminder-{{ trigger.calendar_event.uid }}"
          channel: Kampklar
          clickAction: "/lovelace/kampklar/0"

# ───────────────────────────────────────────────────────────────
# 4) Daglig påmindelse om manglende tilmelding (kl. 18)
# ───────────────────────────────────────────────────────────────
- id: kampklar_mangler_tilmelding_daglig
  alias: Kampklar — manglende tilmelding (daglig kl. 18)
  mode: single
  trigger:
    - platform: time
      at: "18:00:00"
  condition:
    - condition: numeric_state
      entity_id: sensor.kampklar_mangler_tilmelding
      above: 0
  action:
    - variables:
        acts: "{{ state_attr('sensor.kampklar_mangler_tilmelding','activities') or [] }}"
    - service: notify.mobile_app_min_telefon
      data:
        title: "DBU: {{ acts|length }} aktivitet(er) mangler svar"
        message: >-
          {% for a in acts[:5] %}
          • {{ a.child }}: {{ a.title }} ({{ a.date }}{% if a.time %} kl. {{ a.time }}{% endif %})
          {% endfor %}
        data:
          tag: kampklar-pending
          channel: Kampklar
          clickAction: "/lovelace/kampklar/0"
